# Device mode (default): financial data is stored encrypted on the user's phone/browser. The server only serves
# the app and acts as an OCR gateway without storage. No database, no data volume.
#   docker compose up --build -d      ->  http://localhost:8080
#
# Legacy server mode (accounts + PostgreSQL): add docker-compose.server.yml
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up --build -d
#
# Note: browser secure storage (WebCrypto) only works over HTTPS or http://localhost.
# Opening the app via a network IP (http://192.168.x.x:8080) from a phone is rejected by the browser. To test on a phone, use
# an HTTPS tunnel (e.g. cloudflared/ngrok) or `adb reverse tcp:8080 tcp:8080` and open http://localhost:8080 on the phone.
name: smartledger

services:
  api:
    build: .
    image: smartledger:local
    ports:
      - "127.0.0.1:8080:8080" # reachable from this machine only
    environment:
      ADDR: ":8080"
      STORAGE_MODE: device
      # OCR defaults to mock (free, fake). To try a real OCR engine from a laptop, set these in .env or the shell:
      #   Gemini API (free tier): OCR_BACKEND=gemini  GEMINI_API_KEY=<key from aistudio.google.com>
      #   Vertex AI (paid):       OCR_BACKEND=vertex  VERTEX_PROJECT=<project id>  VERTEX_ACCESS_TOKEN=$(gcloud auth print-access-token)
      # On Cloud Run these are set at deploy time (see README, "Cloud architecture"), not through compose.
      OCR_BACKEND: ${OCR_BACKEND:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      VERTEX_MODEL: ${VERTEX_MODEL:-}
      VERTEX_ACCESS_TOKEN: ${VERTEX_ACCESS_TOKEN:-} # local testing only; valid for about 1 hour
      OCR_ACCESS_CODE: ${OCR_ACCESS_CODE:-} # optional: code clients must send to use OCR
      OCR_DAILY_CAP: ${OCR_DAILY_CAP:-300} # cost guard: total OCR calls per day
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0} # 0 locally; 1 behind Cloud Run
    healthcheck:
      test: ["CMD", "/ledger", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Container hardening: read-only filesystem, no capabilities. Nothing is written to disk.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
