# Mode PERANGKAT (default): data keuangan tersimpan terenkripsi di HP/browser pengguna. Server hanya menyajikan
# aplikasi dan menjadi gerbang OCR tanpa penyimpanan. TIDAK ada database, TIDAK ada volume data.
#   docker compose up --build -d      ->  http://localhost:8080
#
# Mode server lama (akun + PostgreSQL): tambahkan docker-compose.server.yml
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up --build -d
#
# CATATAN: fitur penyimpanan aman di browser (WebCrypto) hanya jalan di HTTPS atau http://localhost.
# Membuka lewat IP jaringan (http://192.168.x.x:8080) dari HP akan DITOLAK browser. Untuk uji di HP gunakan
# terowongan HTTPS (mis. cloudflared/ngrok) atau `adb reverse tcp:8080 tcp:8080` lalu buka http://localhost:8080 di HP.
name: smartledger

services:
  api:
    build: .
    image: smartledger:local
    ports:
      - "127.0.0.1:8080:8080" # hanya bisa diakses dari komputer ini
    environment:
      ADDR: ":8080"
      STORAGE_MODE: device
      OCR_BACKEND: mock # OCR tiruan lokal; produksi: vertex (lihat README, bagian migrasi ke cloud)
      OCR_ACCESS_CODE: ${OCR_ACCESS_CODE:-} # opsional: kode yang harus dikirim klien untuk memakai OCR
      OCR_DAILY_CAP: ${OCR_DAILY_CAP:-300} # pengaman biaya: total panggilan OCR per hari
      # --- Padanan untuk Cloud Run (diisi lewat Terraform, bukan compose); lihat README bagian "Migrasi ke cloud" ---
      # CLOUD: TRUSTED_PROXY_HOPS: "1"
      # CLOUD: OCR_BACKEND: vertex         (+ VERTEX_PROJECT, VERTEX_LOCATION, VERTEX_MODEL)
      # CLOUD: OCR_ACCESS_CODE: <dari Secret Manager>
    healthcheck:
      test: ["CMD", "/ledger", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Hardening container: filesystem read-only, tanpa capability. Tidak ada yang ditulis ke disk.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
