# Menjalankan SELURUH aplikasi di komputer lokal: PostgreSQL + migrasi + API + antarmuka web.
# Tanpa layanan cloud apa pun. Buka http://localhost:8080 setelah `docker compose up`.
name: smartledger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?jalankan scripts/init-env.ps1 dulu}
      POSTGRES_DB: ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Membuat role aplikasi `ledger_app` (bukan superuser, tunduk pada RLS). Hanya jalan saat volume baru.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Port 5432 sengaja TIDAK dipublikasikan: hanya container lain yang bisa menjangkau database.
    # Untuk menjalankan tes integrasi dari Windows, lihat docker-compose.dev.yml.

  migrate:
    build: .
    image: smartledger:local
    command: ["migrate"]
    environment:
      # Pemilik skema, hanya dipakai sebentar untuk migrasi; API tidak pernah memakai kredensial ini.
      MIGRATE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ledger?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: smartledger:local
    ports:
      - "127.0.0.1:8080:8080" # hanya bisa diakses dari komputer ini
    environment:
      ADDR: ":8080"
      # Role terbatas: tanpa DELETE, tanpa akses langsung ke tabel sesi, tunduk pada Row Level Security.
      DATABASE_URL: postgres://ledger_app:ledger_app_dev@db:5432/ledger?sslmode=disable
      DATA_KEYS: ${DATA_KEYS:?jalankan scripts/init-env.ps1 dulu}
      DATA_KEY_ACTIVE: ${DATA_KEY_ACTIVE:-1}
      PHONE_PEPPER: ${PHONE_PEPPER:?jalankan scripts/init-env.ps1 dulu}
      STORAGE_BACKEND: local
      OCR_BACKEND: mock
      # --- Padanan untuk Cloud Run (diisi lewat Terraform, bukan compose); lihat README bagian "Migrasi ke cloud" ---
      # CLOUD: TRUSTED_PROXY_HOPS: "1"
      # CLOUD: DATABASE_URL: postgres://ledger_app:<dari Secret Manager>@/ledger?host=/cloudsql/PROJECT:REGION:INSTANCE&sslmode=disable
      # CLOUD: STORAGE_BACKEND: gcs        (+ GCS_BUCKET)
      # CLOUD: OCR_BACKEND: vertex         (+ VERTEX_PROJECT, VERTEX_LOCATION, VERTEX_MODEL)
    volumes:
      - receipts:/data/receipts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/ledger", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Hardening container: filesystem read-only (hanya volume foto yang bisa ditulis), tanpa capability.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  receipts:
